<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Pembelajaran Rasio - Buku & Pensil</title>
    <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1.3.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Comic Sans MS', 'Arial', sans-serif;
        }
        
        #start-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            color: white;
        }
        
        #marker-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            max-width: 90%;
        }
        
        #marker-container h2 {
            color: #667eea;
            margin: 0 0 20px 0;
            font-size: 28px;
        }
        
        #marker-container p {
            color: #666;
            margin: 10px 0;
            font-size: 16px;
        }
        
        #marker-image {
            width: 280px;
            height: 280px;
            margin: 20px auto;
            border: 3px solid #333;
            border-radius: 10px;
            background: white;
        }
        
        #start-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            transition: transform 0.3s;
        }
        
        #start-btn:hover {
            transform: scale(1.05);
        }
        
        #download-btn {
            background: #4ECDC4;
            color: white;
            border: none;
            padding: 10px 30px;
            font-size: 16px;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            transition: transform 0.3s;
        }
        
        #download-btn:hover {
            transform: scale(1.05);
        }
        
        .hidden {
            display: none !important;
        }
        
        #info-panel {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            padding: 20px 30px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            text-align: center;
            z-index: 1000;
            max-width: 90%;
            animation: slideDown 0.5s ease-out;
        }
        
        @keyframes slideDown {
            from {
                transform: translateX(-50%) translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateX(-50%) translateY(0);
                opacity: 1;
            }
        }
        
        #info-panel h2 {
            margin: 0 0 10px 0;
            color: #FF6B6B;
            font-size: 24px;
        }
        
        #info-panel p {
            margin: 5px 0;
            color: #333;
            font-size: 18px;
            line-height: 1.6;
        }
        
        .highlight {
            color: #4ECDC4;
            font-weight: bold;
            font-size: 22px;
        }
        
        .ratio-display {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 15px;
            margin-top: 15px;
            font-size: 28px;
            font-weight: bold;
        }
        
        #instructions {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(52, 152, 219, 0.9);
            color: white;
            padding: 15px 25px;
            border-radius: 15px;
            text-align: center;
            z-index: 1000;
            font-size: 16px;
        }
        
        .a-loader-title {
            display: none !important;
        }

        /* Make A-Frame scene occupy the full viewport and sit behind UI */
        a-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 0;
            background: transparent;
        }

        /* Ensure UI overlays sit above the scene */
        #start-screen, #marker-container, #info-panel, #instructions {
            z-index: 10;
        }

        /* Responsive tweaks */
        @media (max-width: 600px) {
            #marker-container {
                padding: 18px;
                max-width: 92%;
            }

            #marker-image {
                width: 70vw;
                max-width: 320px;
                height: auto;
            }

            #start-btn, #download-btn {
                width: 100%;
                font-size: 18px;
                padding: 14px 18px;
                border-radius: 12px;
            }

            #info-panel {
                left: 50%;
                transform: translateX(-50%);
                width: calc(100% - 40px);
                padding: 12px 14px;
                font-size: 15px;
                top: 12px;
            }

            #instructions {
                font-size: 14px;
                padding: 12px 16px;
                bottom: 14px;
                width: calc(100% - 40px);
            }

            .ratio-display {
                font-size: 20px;
                padding: 10px;
            }
        }

        @media (min-width: 601px) {
            #marker-container {
                max-width: 520px;
                padding: 36px;
            }

            #marker-image {
                width: 320px;
                height: 320px;
            }

            #start-btn {
                padding: 16px 60px;
                font-size: 22px;
            }

            #info-panel {
                top: 24px;
                font-size: 18px;
                padding: 18px 30px;
            }
        }

    </style>
</head>
<body>
    <div id="start-screen">
        <div id="marker-container">
            <h2>📚 AR Pembelajaran Rasio</h2>
            <p>Gunakan marker HIRO di bawah ini</p>
            <img id="marker-image" src="https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png" alt="Hiro Marker">
            <br>
            <button id="download-btn">📥 Download Marker</button>
            <br>
            <button id="start-btn">🚀 Mulai AR Experience</button>
            <p style="color: #999; font-size: 14px; margin-top: 15px;">
                💡 Cetak marker atau tampilkan di layar lain
            </p>
        </div>
    </div>
    
    <div id="info-panel" class="hidden">
        <h2>🎯 Mari Belajar Rasio!</h2>
        <p id="step-info">Arahkan kamera ke marker HIRO</p>
    </div>
    
    <div id="instructions" class="hidden">
        📱 Arahkan kamera ke marker untuk melihat objek 3D
    </div>

    <a-scene id="ar-scene"
        embedded
        arjs="sourceType: webcam; debugUIEnabled: false; detectionMode: mono_and_matrix; matrixCodeType: 3x3;"
        vr-mode-ui="enabled: false"
        renderer="logarithmicDepthBuffer: true; precision: medium;"
        style="position:absolute;top:0;left:0;width:100%;height:100vh;z-index:0;"
    >
        <a-assets>
            <a-asset-item id="book-obj" src=""></a-asset-item>
        </a-assets>

        <a-marker preset="hiro" id="hiro-marker">
            <!-- Buku 1 -->
            <a-box 
                id="book1"
                position="-1.2 0.15 0" 
                rotation="0 0 0" 
                width="0.4" 
                height="0.6" 
                depth="0.06"
                color="#FF6B6B"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"
                animation__hover="property: position; to: -1.2 0.3 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
            >
                <a-box position="0 0 -0.02" width="0.38" height="0.58" depth="0.04" color="#FFF8DC"></a-box>
            </a-box>
            
            <!-- Buku 2 -->
            <a-box 
                id="book2"
                position="-0.6 0.15 0" 
                rotation="0 0 0" 
                width="0.4" 
                height="0.6" 
                depth="0.06"
                color="#FF8E8E"
                animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; delay: 1000; easing: linear"
                animation__hover="property: position; to: -0.6 0.3 0; dir: alternate; dur: 1000; delay: 500; loop: true; easing: easeInOutSine"
            >
                <a-box position="0 0 -0.02" width="0.38" height="0.58" depth="0.04" color="#FFF8DC"></a-box>
            </a-box>
            
            <!-- Pensil 1 -->
            <a-entity id="pencil1" position="0.2 0.2 0">
                <a-cylinder 
                    position="0 0 0" 
                    radius="0.03" 
                    height="0.7"
                    color="#FFD93D"
                    animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; easing: linear"
                    animation__hover="property: position; to: 0 0.15 0; dir: alternate; dur: 1000; loop: true; easing: easeInOutSine"
                ></a-cylinder>
                <a-cone position="0 -0.375 0" radius-bottom="0.03" radius-top="0" height="0.1" color="#8B4513"></a-cone>
                <a-cylinder position="0 0.38 0" radius="0.035" height="0.08" color="#FFB6C1"></a-cylinder>
            </a-entity>
            
            <!-- Pensil 2 -->
            <a-entity id="pencil2" position="0.7 0.2 0">
                <a-cylinder 
                    position="0 0 0" 
                    radius="0.03" 
                    height="0.7"
                    color="#4ECDC4"
                    animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; delay: 1000; easing: linear"
                    animation__hover="property: position; to: 0 0.15 0; dir: alternate; dur: 1000; delay: 333; loop: true; easing: easeInOutSine"
                ></a-cylinder>
                <a-cone position="0 -0.375 0" radius-bottom="0.03" radius-top="0" height="0.1" color="#8B4513"></a-cone>
                <a-cylinder position="0 0.38 0" radius="0.035" height="0.08" color="#FFB6C1"></a-cylinder>
            </a-entity>
            
            <!-- Pensil 3 -->
            <a-entity id="pencil3" position="1.2 0.2 0">
                <a-cylinder 
                    position="0 0 0" 
                    radius="0.03" 
                    height="0.7"
                    color="#95E1D3"
                    animation="property: rotation; to: 0 0 360; loop: true; dur: 6000; delay: 2000; easing: linear"
                    animation__hover="property: position; to: 0 0.15 0; dir: alternate; dur: 1000; delay: 666; loop: true; easing: easeInOutSine"
                ></a-cylinder>
                <a-cone position="0 -0.375 0" radius-bottom="0.03" radius-top="0" height="0.1" color="#8B4513"></a-cone>
                <a-cylinder position="0 0.38 0" radius="0.035" height="0.08" color="#FFB6C1"></a-cylinder>
            </a-entity>
            
            <!-- Label Rasio -->
            <a-text 
                id="ratio-text"
                value="2 Buku : 3 Pensil = 2:3" 
                position="0 -0.8 0" 
                align="center" 
                color="#667eea"
                width="3"
                font="https://cdn.aframe.io/fonts/Roboto-msdf.json"
            ></a-text>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <script>
        let currentStep = 0;
        let markerFound = false;
        let stepInterval;
        
        const steps = [
            { text: "Mari hitung semua objek! 🎯", objects: [] },
            { text: "Ini ada <span class='highlight'>2 Buku</span> 📚", objects: ['book1', 'book2'] },
            { text: "Dan ada <span class='highlight'>3 Pensil</span> ✏️", objects: ['pencil1', 'pencil2', 'pencil3'] },
            { text: "Total: <span class='highlight'>5 Objek</span> (2 + 3)", objects: ['book1', 'book2', 'pencil1', 'pencil2', 'pencil3'] },
            { text: "<div class='ratio-display'>Rasio = 2 : 3</div>Artinya untuk setiap 2 buku, ada 3 pensil!", objects: [] }
        ];
        
        // Download marker
        document.getElementById('download-btn').addEventListener('click', () => {
            const link = document.createElement('a');
            link.href = 'https://raw.githubusercontent.com/AR-js-org/AR.js/master/data/images/hiro.png';
            link.download = 'hiro-marker.png';
            link.click();
        });
        
        // Start button
        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('start-screen').classList.add('hidden');
            document.getElementById('instructions').classList.remove('hidden');
            document.getElementById('info-panel').classList.remove('hidden');
        });
        
        // Marker detection
        AFRAME.registerComponent('marker-handler', {
            init: function() {
                const marker = document.querySelector('#hiro-marker');
                
                marker.addEventListener('markerFound', () => {
                    console.log('Marker ditemukan!');
                    markerFound = true;
                    document.getElementById('instructions').classList.add('hidden');
                    document.getElementById('info-panel').classList.remove('hidden');
                    startLearningSequence();
                });
                
                marker.addEventListener('markerLost', () => {
                    console.log('Marker hilang!');
                    markerFound = false;
                    document.getElementById('instructions').classList.remove('hidden');
                    stopLearningSequence();
                });
            }
        });
        
        // Add component to scene
        document.querySelector('a-scene').setAttribute('marker-handler', '');
        
        function startLearningSequence() {
            currentStep = 0;
            showStep();
            
            if(stepInterval) clearInterval(stepInterval);
            
            stepInterval = setInterval(() => {
                if(markerFound && currentStep < steps.length - 1) {
                    currentStep++;
                    showStep();
                    highlightObjects();
                } else if(currentStep >= steps.length - 1) {
                    clearInterval(stepInterval);
                }
            }, 3500);
        }
        
        function stopLearningSequence() {
            if(stepInterval) {
                clearInterval(stepInterval);
            }
            currentStep = 0;
            resetHighlight();
        }
        
        function showStep() {
            const stepInfo = document.getElementById('step-info');
            stepInfo.innerHTML = steps[currentStep].text;
        }
        
        function highlightObjects() {
            resetHighlight();
            
            const objectsToHighlight = steps[currentStep].objects;
            
            objectsToHighlight.forEach(objId => {
                const obj = document.getElementById(objId);
                if(obj) {
                    obj.setAttribute('scale', '1.4 1.4 1.4');
                    
                    // Add glow effect
                    if(objId.includes('book')) {
                        obj.setAttribute('material', 'emissive', '#FF6B6B');
                        obj.setAttribute('material', 'emissiveIntensity', '0.5');
                    } else if(objId.includes('pencil')) {
                        const cylinder = obj.querySelector('a-cylinder');
                        if(cylinder) {
                            cylinder.setAttribute('material', 'emissive', '#FFD93D');
                            cylinder.setAttribute('material', 'emissiveIntensity', '0.5');
                        }
                    }
                }
            });
        }
        
        function resetHighlight() {
            ['book1', 'book2', 'pencil1', 'pencil2', 'pencil3'].forEach(objId => {
                const obj = document.getElementById(objId);
                if(obj) {
                    obj.setAttribute('scale', '1 1 1');
                    
                    if(objId.includes('book')) {
                        obj.setAttribute('material', 'emissive', '#000000');
                        obj.setAttribute('material', 'emissiveIntensity', '0');
                    } else if(objId.includes('pencil')) {
                        const cylinder = obj.querySelector('a-cylinder');
                        if(cylinder) {
                            cylinder.setAttribute('material', 'emissive', '#000000');
                            cylinder.setAttribute('material', 'emissiveIntensity', '0');
                        }
                    }
                }
            });
        }
        
        // Prevent screen dimming
        if ('wakeLock' in navigator) {
            navigator.wakeLock.request('screen').catch(err => {
                console.log('Wake Lock error:', err);
            });
        }
    </script>
</body>
</html>
